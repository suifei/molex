name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MOLEX_VERSION: 0.3.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check frontend
        run: npm run check && npm test && npm run build
        working-directory: frontend
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Race test Go
        run: go test -race ./...

  cross-platform-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Build Web-enabled binary
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ env.MOLEX_VERSION }}" -o molex${{ runner.os == 'Windows' && '.exe' || '' }} .
